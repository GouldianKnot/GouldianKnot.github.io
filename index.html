<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The GouldianKnot</title>
<link rel="canonical" href="voices/index.html">
<!-- No-JS fallback. The script below normally gets there first. -->
<meta http-equiv="refresh" content="0; url=voices/index.html">
<script>
  // location.replace(), not location.href = ... : this page must NOT become a
  // step in the browser history. With an ordinary assignment, pressing Back
  // from the arrival point would land here and be bounced straight forward
  // again, trapping the reader. replace() swaps this entry out instead.
  //
  // Any query string or #fragment typed against the bare domain is carried
  // through, so gouldianknot.github.io/#grid still arrives in the right place.
  location.replace('voices/index.html' + location.search + location.hash);
</script>

  html, body { height: 100%; margin: 0; }
  body {
    background: #f4ecd8; color: #3a3226;

    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  p { font-size: 17px; font-style: italic; opacity: 0.75; line-height: 1.6; margin: 0 24px; }
  a { color: #1f7a6e; }
</style>
</head>
