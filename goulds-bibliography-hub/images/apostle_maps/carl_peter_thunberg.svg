<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Route map of Carl Peter Thunberg, 1743-1828: Returned to Uppsala, 1779, succeeding Linnaeus’s own chair as professor of botany">
  <rect width="640" height="220" fill="#fbf8f2"/>
  <text x="320.0" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c2620">Carl Peter Thunberg</text>
  <text x="320.0" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#8a7a63">1743-1828</text>
  <path d="M 56.8 132.4 Q 56.8 132.4 87.6 114.4 Q 118.4 96.4 168.8 114.4 Q 219.2 132.4 283.6 114.4 Q 348.0 96.4 395.6 114.4 Q 443.2 132.4 479.6 114.4 Q 516.0 96.4 549.6 114.4 T 583.2 132.4" fill="none" stroke="#a6192e" stroke-width="1.8" stroke-dasharray="1,5" stroke-linecap="round"/>
  <circle cx="56.8" cy="132.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="118.4" cy="96.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="219.2" cy="132.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="348.0" cy="96.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="443.2" cy="132.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="516.0" cy="96.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="583.2" cy="132.4" r="6" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/>
  <text x="56.8" y="120.4" text-anchor="start" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="56.8" dy="0">Uppsala</tspan></text><text x="118.4" y="118.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="118.4" dy="0">Paris &amp; Amsterdam</tspan></text><text x="219.2" y="120.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="219.2" dy="0">Cape of Good Hope</tspan><tspan x="219.2" dy="11">(3 years)</tspan></text><text x="348.0" y="118.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="348.0" dy="0">Batavia</tspan></text><text x="443.2" y="120.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="443.2" dy="0">Dejima, Nagasaki</tspan><tspan x="443.2" dy="11">(confined)</tspan></text><text x="516.0" y="118.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="516.0" dy="0">Batavia</tspan></text><text x="583.2" y="120.4" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="583.2" dy="0">Uppsala</tspan></text>
  <text x="320.0" y="206" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1f7a6e">Returned to Uppsala, 1779, succeeding Linnaeus’s own chair as professor of botany</text>
</svg>