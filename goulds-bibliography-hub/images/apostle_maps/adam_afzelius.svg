<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Route map of Adam Afzelius, 1750-1837: Returned to Sweden, 1796, with a large botanical haul — lived on to age 87">
  <rect width="640" height="220" fill="#fbf8f2"/>
  <text x="320.0" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c2620">Adam Afzelius</text>
  <text x="320.0" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#8a7a63">1750-1837</text>
  <path d="M 56.8 132.4 Q 56.8 132.4 104.4 114.4 Q 152.0 96.4 250.0 114.4 Q 348.0 132.4 404.0 114.4 Q 460.0 96.4 516.0 114.4 T 572.0 132.4" fill="none" stroke="#a6192e" stroke-width="1.8" stroke-dasharray="1,5" stroke-linecap="round"/>
  <circle cx="56.8" cy="132.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="152.0" cy="96.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="348.0" cy="132.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="460.0" cy="96.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="572.0" cy="132.4" r="6" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/>
  <text x="56.8" y="120.4" text-anchor="start" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="56.8" dy="0">Uppsala</tspan></text><text x="152.0" y="118.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="152.0" dy="0">London</tspan></text><text x="348.0" y="120.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="348.0" dy="0">Sierra Leone</tspan><tspan x="348.0" dy="11">(Freetown colony)</tspan></text><text x="460.0" y="118.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="460.0" dy="0">French naval attack</tspan><tspan x="460.0" dy="11">(1794)</tspan></text><text x="572.0" y="120.4" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="572.0" dy="0">Uppsala</tspan></text>
  <text x="320.0" y="206" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1f7a6e">Returned to Sweden, 1796, with a large botanical haul — lived on to age 87</text>
</svg>