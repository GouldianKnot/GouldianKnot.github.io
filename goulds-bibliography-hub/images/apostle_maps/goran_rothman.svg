<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Route map of Göran Rothman, 1739-1778: Returned safely, 1776 — but with little to show for the years away">
  <rect width="640" height="220" fill="#fbf8f2"/>
  <text x="320.0" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c2620">Göran Rothman</text>
  <text x="320.0" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#8a7a63">1739-1778</text>
  <path d="M 62.4 132.4 Q 62.4 132.4 177.2 114.4 Q 292.0 96.4 362.0 114.4 Q 432.0 132.4 502.0 114.4 T 572.0 96.4" fill="none" stroke="#a6192e" stroke-width="1.8" stroke-dasharray="1,5" stroke-linecap="round"/>
  <circle cx="62.4" cy="132.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="292.0" cy="96.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="432.0" cy="132.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="572.0" cy="96.4" r="6" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/>
  <text x="62.4" y="120.4" text-anchor="start" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="62.4" dy="0">Uppsala</tspan></text><text x="292.0" y="118.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="292.0" dy="0">Libya</tspan></text><text x="432.0" y="120.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="432.0" dy="0">Tunisia</tspan></text><text x="572.0" y="118.4" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="572.0" dy="0">Uppsala</tspan></text>
  <text x="320.0" y="206" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1f7a6e">Returned safely, 1776 — but with little to show for the years away</text>
