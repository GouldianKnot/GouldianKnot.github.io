<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Route map of Olof Torén, 1718-1753: Returned safely with his collections, 1752 — but died shortly after, 1753">
  <rect width="640" height="220" fill="#fbf8f2"/>
  <text x="320.0" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c2620">Olof Torén</text>
  <text x="320.0" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#8a7a63">1718-1753</text>
  <path d="M 62.4 132.4 Q 62.4 132.4 112.8 114.4 Q 163.2 96.4 255.6 114.4 Q 348.0 132.4 423.6 114.4 Q 499.2 96.4 535.6 114.4 T 572.0 132.4" fill="none" stroke="#a6192e" stroke-width="1.8" stroke-dasharray="1,5" stroke-linecap="round"/>
  <circle cx="62.4" cy="132.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="163.2" cy="96.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="348.0" cy="132.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="499.2" cy="96.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="572.0" cy="132.4" r="6" fill="#7a2b1f" stroke="#fbf8f2" stroke-width="1.5"/><path d="M 567.0 123.4 L 577.0 123.4 M 572.0 123.4 L 572.0 116.4" stroke="#7a2b1f" stroke-width="1.6" stroke-linecap="round"/>
  <text x="62.4" y="120.4" text-anchor="start" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="62.4" dy="0">Uppsala</tspan></text><text x="163.2" y="118.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="163.2" dy="0">Gothenburg</tspan><tspan x="163.2" dy="11">(East India Co.)</tspan></text><text x="348.0" y="120.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="348.0" dy="0">Surat, India</tspan></text><text x="499.2" y="118.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="499.2" dy="0">Canton, China</tspan></text><text x="572.0" y="120.4" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="572.0" dy="0">Gothenburg</tspan></text>
  <text x="320.0" y="206" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#7a2b1f">Returned safely with his collections, 1752 — but died shortly after, 1753</text>
</svg>