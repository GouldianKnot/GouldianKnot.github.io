<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Route map of Anton Rolandsson Martin, 1729-1785: Shortest and coldest of the 17 — a brief Arctic landing, then home">
  <rect width="640" height="220" fill="#fbf8f2"/>
  <text x="320.0" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c2620">Anton Rolandsson Martin</text>
  <text x="320.0" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#8a7a63">1729-1785</text>
  <path d="M 68.0 132.4 Q 68.0 132.4 138.0 114.4 Q 208.0 96.4 334.0 114.4 Q 460.0 132.4 516.0 114.4 T 572.0 96.4" fill="none" stroke="#a6192e" stroke-width="1.8" stroke-dasharray="1,5" stroke-linecap="round"/>
  <circle cx="68.0" cy="132.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="208.0" cy="96.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="460.0" cy="132.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="572.0" cy="96.4" r="6" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/>
  <text x="68.0" y="120.4" text-anchor="start" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="68.0" dy="0">Uppsala</tspan></text><text x="208.0" y="118.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="208.0" dy="0">Norway coast</tspan></text><text x="460.0" y="120.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="460.0" dy="0">Spitsbergen</tspan><tspan x="460.0" dy="11">(brief landing)</tspan></text><text x="572.0" y="118.4" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="572.0" dy="0">Uppsala</tspan></text>
  <text x="320.0" y="206" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1f7a6e">Shortest and coldest of the 17 — a brief Arctic landing, then home</text>
