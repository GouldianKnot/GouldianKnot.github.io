<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Route map of Daniel Rolander, 1725-1793: Returned to Sweden, 1756 — then refused to hand his collection to Linnaeus at all">
  <rect width="640" height="220" fill="#fbf8f2"/>
  <text x="320.0" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c2620">Daniel Rolander</text>
  <text x="320.0" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#8a7a63">1725-1793</text>
  <path d="M 62.4 132.4 Q 62.4 132.4 112.8 114.4 Q 163.2 96.4 269.6 114.4 Q 376.0 132.4 474.0 114.4 T 572.0 96.4" fill="none" stroke="#a6192e" stroke-width="1.8" stroke-dasharray="1,5" stroke-linecap="round"/>
  <circle cx="62.4" cy="132.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="163.2" cy="96.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="376.0" cy="132.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="572.0" cy="96.4" r="6" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/>
  <text x="62.4" y="120.4" text-anchor="start" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="62.4" dy="0">Uppsala</tspan></text><text x="163.2" y="118.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="163.2" dy="0">Cadiz</tspan></text><text x="376.0" y="120.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="376.0" dy="0">Suriname</tspan><tspan x="376.0" dy="11">(rainforest interior)</tspan></text><text x="572.0" y="118.4" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="572.0" dy="0">Uppsala</tspan></text>
  <text x="320.0" y="206" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1f7a6e">Returned to Sweden, 1756 — then refused to hand his collection to Linnaeus at all</text>
</svg>