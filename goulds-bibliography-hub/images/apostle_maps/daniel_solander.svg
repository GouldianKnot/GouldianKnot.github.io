<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Route map of Daniel Solander, 1733-1782: Completed Cook’s first voyage and returned to London, 1771 — but never went back to Sweden, dying in London, 1782">
