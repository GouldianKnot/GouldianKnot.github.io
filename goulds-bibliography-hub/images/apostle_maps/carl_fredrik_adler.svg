<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Route map of Carl Fredrik Adler, 1720-1761: Died in Java, 1761 — the East Indies claimed him, as it had Tärnström before him">
  <rect width="640" height="220" fill="#fbf8f2"/>
  <text x="320.0" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c2620">Carl Fredrik Adler</text>
  <text x="320.0" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#8a7a63">1720-1761</text>
  <path d="M 62.4 132.4 Q 62.4 132.4 149.2 114.4 Q 236.0 96.4 306.0 114.4 Q 376.0 132.4 460.0 114.4 T 544.0 96.4" fill="none" stroke="#a6192e" stroke-width="1.8" stroke-dasharray="1,5" stroke-linecap="round"/>
  <circle cx="62.4" cy="132.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="236.0" cy="96.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="376.0" cy="132.4" r="4" fill="#1f7a6e" stroke="#fbf8f2" stroke-width="1.5"/><circle cx="544.0" cy="96.4" r="6" fill="#7a2b1f" stroke="#fbf8f2" stroke-width="1.5"/><path d="M 539.0 87.4 L 549.0 87.4 M 544.0 87.4 L 544.0 80.4" stroke="#7a2b1f" stroke-width="1.6" stroke-linecap="round"/>
  <text x="62.4" y="120.4" text-anchor="start" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="62.4" dy="0">Uppsala</tspan></text><text x="236.0" y="118.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="236.0" dy="0">Surat, India</tspan></text><text x="376.0" y="120.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="376.0" dy="0">China</tspan></text><text x="544.0" y="118.4" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c2620"><tspan x="544.0" dy="0">Java</tspan></text>
  <text x="320.0" y="206" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#7a2b1f">Died in Java, 1761 — the East Indies claimed him, as it had Tärnström before him</text>
